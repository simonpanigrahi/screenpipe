# Required for the AndroidX libraries used by the app.
android.useAndroidX=true            # use the modern AndroidX support libraries (required by core-ktx / appcompat)
android.nonTransitiveRClass=true    # each module gets its own R class (smaller, faster builds; avoids leaking resource refs across modules)
kotlin.code.style=official          # use the official Kotlin code-style conventions for IDE formatting
