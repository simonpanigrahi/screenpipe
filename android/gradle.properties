# gradle.properties — project-wide Gradle settings.
# NOTE: in a .properties file, '#' comments must be on their OWN line; a '#'
# placed after a value becomes part of that value (it is NOT a trailing comment).

# Use the modern AndroidX support libraries (required by core-ktx / appcompat).
android.useAndroidX=true

# Give each module its own R class (smaller, faster builds; avoids leaking
# resource references across modules).
android.nonTransitiveRClass=true

# Use the official Kotlin code-style conventions for IDE formatting.
kotlin.code.style=official
